; QI-G0/B1 — SensorTerminal: five honest channels on a Heltec V3, over Wi-Fi with serial as the rescue.
; The board env arrives with the sketch (Ф2); [env:native] is the
; pure-math gate — the example's cousin of the C core's cmake+ctest.
[platformio]
src_dir = .
default_envs = heltec_wifi_lora_32_V3
; Wi-Fi credentials (QI-B1): copy secrets.ini.example to secrets.ini and
; fill it in. The file is git-ignored and folded into build flags here —
; the password never enters this repository and never rides argv.
; A network that filters multicast can name the node statically instead
; of relying on announcements:
;   PLATFORMIO_BUILD_FLAGS='-DQI_NODE_HOST=\"192.168.1.10\" -DQI_NODE_PORT=49611' pio run ...
extra_configs = secrets.ini

[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../..
lib_ldf_mode = deep+
build_flags = -DCORE_DEBUG_LEVEL=0

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
lib_deps =
    olikraus/U8g2@^2.35.30
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags = ${env.build_flags} -DDHT_PIN=7
    -DQI_WIFI_SSID='"${wifi.ssid}"' -DQI_WIFI_PASS='"${wifi.pass}"'

[env:lilygo-t3-s3]
platform = espressif32
board = lilygo-t3-s3
lib_deps =
    olikraus/U8g2@^2.35.30
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
    -DMQ_PIN=15 -DMQ_WARMUP_SEC=180

[env:native]
platform = native
framework =
test_framework = unity
lib_extra_dirs =
lib_ldf_mode = chain
build_flags = -std=c++17
