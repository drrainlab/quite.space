[platformio]
src_dir = .
default_envs = lilygo-t3-s3

[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../..
lib_ldf_mode = deep+
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    olikraus/U8g2@^2.35.30
build_flags = -DCORE_DEBUG_LEVEL=0

[env:lilygo-t3-s3]
platform = espressif32
board = lilygo-t3-s3
; native USB-C: the serial console is the USB CDC port; OLED on 18/17
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DDHT_PIN=38

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
; Heltec V3 OLED: SDA 17 / SCL 18 (and its RST on 21 must be held high)
build_flags = ${env.build_flags} -DDHT_PIN=7 -DOLED_SDA=17 -DOLED_SCL=18
