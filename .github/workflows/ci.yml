# Root gates — the non-desktop tree stays CGO-free and green.
#
# This is deliberately the plan's exact list (DS-4): the CGO_ENABLED=0 build
# is not an optimisation flag, it is ADR-011 — one pure-Go binary that also
# runs headless on a Pi. The nested cmd/wails-probe module is invisible to
# ./... by construction, which is what keeps this job honest.
name: ci

on:
  push:
  pull_request:

jobs:
  root:
    runs-on: ubuntu-latest
    # 40, not 30: see the -timeout note on the test step below. The job
    # budget must be comfortably larger than the deadline it hands go test,
    # or the fix is a job cancelled instead of a package timed out — the
    # same red, with a worse message.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # node is needed by clients/web-ui tests: the scene lint and the
      # photosensitivity sweep shell out to it (they skip politely when it
      # is absent, and CI must NOT take that skip).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...
      # AR-0. This proves LINK-TIME PORTABILITY and nothing else — that the
      # tree still has no cgo, no build tag that excludes android, and no
      # dependency that stopped compiling for it. It says nothing about what
      # AR-0 actually measures: scrypt on an ARM core, a log replayed on
      # flash, flock on the app's own volume, or a process the OS kills.
      # Same spirit as cmd/wails-probe's split — BUILD is the hard gate, the
      # RUN is somewhere else and is read by a person.
      - name: build android/arm64 (portability only)
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...
      - name: vet
        run: go vet ./...
      # THE DEADLINE IS OURS TO SET, and go test's default is not it.
      #
      # go test allows 10 minutes PER PACKAGE unless told otherwise, and
      # node passes in 13m22s on a fast laptop — measured, every test green.
      # So this job went red on a suite that works, and stayed red across
      # two releases, because nobody names the number: the release workflow
      # does not depend on ci, so the only signal was a cross beside a
      # green build.
      #
      # The number is large because the suite WAITS rather than computes —
      # 100s of CPU across 13 minutes of wall clock, which is sleeps,
      # polling and backoff timers, not work. That also means a slower
      # runner does not stretch it proportionally: a fixed sleep is the
      # same length everywhere.
      #
      # 30m is headroom over the measurement, not an invitation. A suite
      # that grows into it is a suite to make faster; the waiting is the
      # part worth attacking, and it is tracked separately.
      - name: test
        run: go test -timeout 30m ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Same reasoning as the root job, with more room: the race detector
      # multiplies the COMPUTED part of the suite, and node already spends
      # 601s of its 10-minute default before being killed here too —
      # reproduced locally with this exact command.
      - name: test -race
        run: go test -race -timeout 40m ./...
