# Root gates — the non-desktop tree stays CGO-free and green.
#
# This is deliberately the plan's exact list (DS-4): the CGO_ENABLED=0 build
# is not an optimisation flag, it is ADR-011 — one pure-Go binary that also
# runs headless on a Pi. The nested cmd/wails-probe module is invisible to
# ./... by construction, which is what keeps this job honest.
name: ci

on:
  push:
  pull_request:

jobs:
  root:
    runs-on: ubuntu-latest
    # Comfortably above the -timeout handed to go test below, or the fix
    # is a job cancelled instead of a package timed out — the same red,
    # with a worse message.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # node is needed by clients/web-ui tests: the scene lint and the
      # photosensitivity sweep shell out to it (they skip politely when it
      # is absent, and CI must NOT take that skip).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...
      # AR-0. This proves LINK-TIME PORTABILITY and nothing else — that the
      # tree still has no cgo, no build tag that excludes android, and no
      # dependency that stopped compiling for it. It says nothing about what
      # AR-0 actually measures: scrypt on an ARM core, a log replayed on
      # flash, flock on the app's own volume, or a process the OS kills.
      # Same spirit as cmd/wails-probe's split — BUILD is the hard gate, the
      # RUN is somewhere else and is read by a person.
      - name: build android/arm64 (portability only)
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...
      - name: vet
        run: go vet ./...
      # THE DEADLINE IS OURS TO SET, and go test's default is not it.
      #
      # go test allows 10 minutes PER PACKAGE unless told otherwise. node
      # once took 13m22s — green, and killed — and this job stayed red
      # across two releases because nobody named the number: the release
      # workflow does not depend on ci, so the only signal was a cross
      # beside a green build.
      #
      # node now passes in ~6m: it was waiting on a 2s heartbeat and on a
      # relay that never hung up (see node/cadence.go, relayserver). 15m is
      # headroom over that, not an invitation — a suite that grows into it
      # is a suite to make faster, and the way to do that is measured in
      # node/relayreg_testmain_test.go, not by raising this.
      # A RED RUN NAMES ITS DEAD. The log needs a login to read; the
      # annotations do not — so the failure lines are surfaced as
      # ::error annotations, and "which test broke the release" is
      # answerable from the run page and the public API alike.
      - name: test
        run: |
          set -o pipefail
          go test -timeout 15m ./... 2>&1 | tee test.log || {
            grep -aE "^--- FAIL|^FAIL|panic:|test timed out" test.log | head -40 |               while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Same reasoning, with more room: under the detector node passes in
      # ~16m — the compute is scrypt, and the suite pays less for it now
      # (quicklink.TestKDFParams), but every remaining tick is instrumented.
      # 30m is headroom over the measurement.
      - name: test -race
        run: |
          set -o pipefail
          go test -race -timeout 30m ./... 2>&1 | tee race.log || {
            grep -aE "^--- FAIL|^FAIL|panic:|test timed out" race.log | head -10 | while IFS= read -r l; do echo "::error::${l}"; done
            # The first race REPORT, with its stacks — the warning line
            # alone names nothing, and the full log needs a login to read.
            awk '/WARNING: DATA RACE/{c=26} c && c--' race.log | head -30 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
