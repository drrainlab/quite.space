# The DS-0 canary, on all three shells' native platforms.
#
# Two tiers per platform, and the difference is deliberate:
#
#   BUILD is the hard gate. If the pinned Wails alpha stops compiling against
#   our tree on any platform, this workflow is what says so before DS-3 finds
#   out the expensive way.
#
#   RUN is best-effort (continue-on-error): CI runners have no microphone and
#   an unattended session, so a red run step is a signal to read the log, not
#   a broken build. The probe prints `PROBE gate=… verdict=…` lines; the
#   captured log is uploaded as an artifact either way. The first question on
#   Linux and Windows: do blob-backed request bodies survive their scheme
#   handlers, or is finding №1 WebKit-specific? (See cmd/wails-probe/README.)
#
# The probe is a NESTED module (Wails needs CGO; the root forbids it), so
# everything here runs inside cmd/wails-probe and never touches root CI.
name: wails-probe

on:
  push:
    paths:
      - "cmd/wails-probe/**"
      - ".github/workflows/wails-probe.yml"
  pull_request:
    paths:
      - "cmd/wails-probe/**"
      - ".github/workflows/wails-probe.yml"
  # A Wails bump edits only cmd/wails-probe/go.mod, which the paths above
  # catch — but keep a manual trigger for re-running the canary on demand.
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cmd/wails-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: cmd/wails-probe/go.sum

      - name: linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: build (the hard gate)
        run: go build -o probe${{ runner.os == 'Windows' && '.exe' || '' }} .

      # ---- best-effort headless runs: capture PROBE verdicts -------------

      - name: run (linux, under xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          xvfb-run -a bash -c './probe > probe.log 2>&1 & PID=$!; sleep 25; kill $PID' || true
          echo "== verdicts =="; grep "^PROBE" probe.log || echo "(no verdicts captured)"

      - name: run (macos)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ./probe > probe.log 2>&1 & PID=$!; sleep 25; kill $PID || true
          echo "== verdicts =="; grep "^PROBE" probe.log || echo "(no verdicts captured)"

      - name: run (windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\probe.exe" -RedirectStandardOutput probe.log -RedirectStandardError probe.err.log -PassThru
          Start-Sleep -Seconds 25
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "== verdicts =="
          if (Test-Path probe.log) { Select-String -Path probe.log -Pattern "^PROBE" | ForEach-Object { $_.Line } }

      - name: upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log-${{ matrix.os }}
          path: |
            cmd/wails-probe/probe.log
            cmd/wails-probe/probe.err.log
          if-no-files-found: ignore
